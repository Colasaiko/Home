                <p>兄弟们最关心的肯定是 EdgeNova 晚高峰能不能看 4K。为了拿到最真实的数据，我特意连续熬了几个通宵在晚上9点多跑了测速。就结果来看，它的冗余带宽给得还是比较足的，大部分常规地区（像香港、日本）都能瞬间拉满我这边的电信千兆宽带。如果是看流媒体，几乎不存在缓冲的情况。</p>
