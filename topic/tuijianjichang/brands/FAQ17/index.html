<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="光速云常见问题与解答，整理项目已有套餐和使用资料，并链接完整品牌价格页。">

</head>
<body>
  <div id="background"></div>
  <main class="catalog"><nav aria-label="面包屑"><a href="../index.html">全部品牌</a> / <a href="../guangsu/index.html">光速云</a> / 常见问题</nav>
<article class="panel"><h1>光速云常见问题 FAQ</h1><p class="source-note">本页保留项目原有 FAQ 原文，价格与活动条件未在本次实时核验。</p>
<p><a href="../guangsu/index.html">查看光速云完整套餐价格与资料</a></p>
<div class="article-body"><h2>FAQ</h2>
<h3>光速云现在有限时优惠吗？</h3>
<h3>AMM可以用于季付吗？</h3>
<p>可以。</p>
<h3>AMM可以用于半年付吗？</h3>
<p>可以。</p>
<h3>AMM可以用于年付吗？</h3>
<p>可以。</p>
<h3>AMM可以用于两年付或三年付吗？</h3>
<p>可以。</p>
<h3>定制套餐可以使用AMM吗？</h3>
<h3>轻量版可以用AMM吗？</h3>
<p>不能，该套餐当前只有单独年付。</p>
<h3>不限时套餐可以使用AMM吗？</h3>
<p>不能，属于一次性固定总量套餐。</p></div>
<p><a class="button" href="../guangsu/index.html">返回光速云品牌详情</a></p></article></main>
<script>
  // 拦截并重构 Astro 生成的页面布局
  document.addEventListener('DOMContentLoaded', () => {
    const article = document.querySelector('article.panel');
    if (!article) return;

    const bodyDiv = article.querySelector('.article-body');
    if (!bodyDiv) return;

    // 创建左右双栏容器
    const container = document.createElement('div');
    container.style.display = 'grid';
    container.style.gridTemplateColumns = '1fr 1fr';
    container.style.gap = '60px';
    container.style.alignItems = 'start';
    container.style.width = '100%';
    container.style.marginTop = '30px';

    const leftCol = document.createElement('div');
    leftCol.style.position = 'sticky';
    leftCol.style.top = '40px';
    leftCol.style.background = 'rgba(0,0,0,0.6)';
    leftCol.style.padding = '40px 30px';
    leftCol.style.borderRadius = '20px';
    leftCol.style.backdropFilter = 'blur(12px)';
    leftCol.style.border = '1px solid rgba(255,255,255,0.05)';
    leftCol.style.maxHeight = 'calc(100vh - 80px)';
    leftCol.style.overflowY = 'auto';

    const rightCol = document.createElement('div');
    rightCol.style.background = 'rgba(0,0,0,0.6)';
    rightCol.style.padding = '50px';
    rightCol.style.borderRadius = '20px';
    rightCol.style.backdropFilter = 'blur(12px)';
    rightCol.style.border = '1px solid rgba(255,255,255,0.05)';

    // 收集所有不在 article-body 里的元素（它们属于左侧品牌资料和价格）
    const leftElements = [];
    Array.from(article.childNodes).forEach(node => {
      if (node !== bodyDiv && node !== container && node.tagName !== 'SCRIPT') {
        leftElements.push(node);
      }
    });

        leftElements.forEach(node => leftCol.appendChild(node));

    // 新增：去往 latest.html 的专属大按钮（置顶且缩小）
    const latestBtn = document.createElement('a');
    latestBtn.href = 'latest.html';
    latestBtn.innerHTML = '👉 查看最新深度测评与追踪';
    latestBtn.style.display = 'block';
    latestBtn.style.background = 'linear-gradient(135deg, #e34c26, #f39c12)';
    latestBtn.style.color = '#fff';
    latestBtn.style.textAlign = 'center';
    latestBtn.style.padding = '12px';
    latestBtn.style.borderRadius = '8px';
    latestBtn.style.textDecoration = 'none';
    latestBtn.style.fontWeight = 'bold';
    latestBtn.style.fontSize = '1.05rem';
    latestBtn.style.marginBottom = '20px';
    latestBtn.style.boxShadow = '0 5px 15px rgba(227, 76, 38, 0.3)';
    latestBtn.style.transition = '0.3s';
    latestBtn.onmouseover = function() { this.style.transform = 'translateY(-2px)'; this.style.boxShadow = '0 8px 20px rgba(227, 76, 38, 0.5)'; }
    latestBtn.onmouseout = function() { this.style.transform = 'translateY(0)'; this.style.boxShadow = '0 5px 15px rgba(227, 76, 38, 0.3)'; }
    leftCol.prepend(latestBtn);
    
    // 右边放文章
    rightCol.appendChild(bodyDiv);

    container.appendChild(leftCol);
    container.appendChild(rightCol);
    article.appendChild(container);
    
    // 去掉原来 article.panel 的背景限制
    article.style.background = 'transparent';
    article.style.border = 'none';
    article.style.padding = '0';
    
    // 如果网页有 max-width 限制，强制打破
    const main = document.querySelector('main.catalog');
    if(main) {
      main.style.maxWidth = '100%';
      main.style.width = '100%';
      main.style.padding = '40px 4vw';
    }
    
    // 美化左侧的表格
    const tableWrap = leftCol.querySelector('.table-wrap');
    if(tableWrap) {
        tableWrap.style.background = 'rgba(227, 76, 38, 0.08)';
        tableWrap.style.border = '1px solid rgba(227, 76, 38, 0.2)';
        tableWrap.style.borderRadius = '10px';
        tableWrap.style.padding = '15px';
        tableWrap.style.marginTop = '20px';
    }
  });
</script>
<script>
// 修正版：将又长又臭的价格表格折叠为现代化的“下拉切换”组件
document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
        const tableWraps = document.querySelectorAll('.table-wrap');
        tableWraps.forEach(tableWrap => {
            const table = tableWrap.querySelector('table');
            if (!table) return;
            const tbody = table.querySelector('tbody');
            if (!tbody) return;

            const rows = Array.from(tbody.querySelectorAll('tr'));
            const packages = {};
            
            rows.forEach(tr => {
                const tds = tr.querySelectorAll('td');
                if (tds.length < 3) return;
                const name = tds[0].textContent.trim();
                const period = tds[1].textContent.trim();
                const price = tds[2].textContent.trim();
                const note = '<span style="color: #777; font-size: 0.9rem;">暂无优惠码</span>';
                
                if (!packages[name]) {
                    packages[name] = [];
                }
                packages[name].push({ period, price, note });
            });

            // 检查是否已经转换过，避免重复
            if (Object.keys(packages).length === rows.length) return;

            tbody.innerHTML = '';
            
            for (const [name, cycles] of Object.entries(packages)) {
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
                
                const tdName = document.createElement('td');
                tdName.style.fontWeight = 'bold';
                tdName.style.color = '#fff';
                tdName.style.padding = '12px 15px';
                tdName.textContent = name;
                tr.appendChild(tdName);
                
                const tdPeriod = document.createElement('td');
                tdPeriod.style.padding = '12px 15px';
                const tdPrice = document.createElement('td');
                tdPrice.style.padding = '12px 15px';
                tdPrice.style.color = '#e34c26';
                tdPrice.style.fontWeight = 'bold';
                tdPrice.style.fontSize = '1.15rem';
                tdPrice.style.transition = '0.2s';
                
                const tdNote = document.createElement('td');
                tdNote.style.padding = '12px 15px';
                tdNote.style.color = '#aaa';
                
                if (cycles.length === 1) {
                    tdPeriod.innerHTML = '<span style="background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; font-size: 0.9rem;">' + cycles[0].period + '</span>';
                    tdPrice.textContent = cycles[0].price;
                    tdNote.innerHTML = cycles[0].note;
                } else {
                    const select = document.createElement('select');
                    select.style.background = 'rgba(79, 172, 254, 0.1)';
                    select.style.color = '#4facfe';
                    select.style.border = '1px solid #4facfe';
                    select.style.padding = '6px 10px';
                    select.style.borderRadius = '6px';
                    select.style.cursor = 'pointer';
                    select.style.outline = 'none';
                    select.style.fontWeight = 'bold';
                    select.style.fontSize = '0.9rem';
                    
                    cycles.forEach((cycle, index) => {
                        const opt = document.createElement('option');
                        opt.value = index;
                        opt.style.background = '#222';
                        opt.style.color = '#fff';
                        opt.textContent = cycle.period;
                        select.appendChild(opt);
                    });
                    
                    tdPeriod.appendChild(select);
                    
                    tdPrice.textContent = cycles[0].price;
                    tdNote.innerHTML = cycles[0].note;
                    
                    select.addEventListener('change', (e) => {
                        const selected = cycles[e.target.value];
                        tdPrice.textContent = selected.price;
                        tdNote.innerHTML = selected.note;
                        
                        tdPrice.style.transform = 'scale(1.2)';
                        tdPrice.style.color = '#4facfe';
                        setTimeout(() => { 
                            tdPrice.style.transform = 'scale(1)'; 
                            tdPrice.style.color = '#e34c26';
                        }, 200);
                    });
                }
                
                tr.appendChild(tdPeriod);
                tr.appendChild(tdPrice);
                tr.appendChild(tdNote);
                tbody.appendChild(tr);
            }
        });
    }, 50); // 增加 50ms 延迟，确保第一个脚本已经重构完毕 DOM
});
</script>
</body>
</html>
