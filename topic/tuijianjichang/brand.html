<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品牌测评报告</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <!-- 引入 marked.js 解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .md-container {
            background: rgba(0,0,0,0.5);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            color: #ddd;
            line-height: 1.8;
            font-size: 1.05rem;
            backdrop-filter: blur(10px);
        }
        .md-container h1, .md-container h2, .md-container h3, .md-container h4 {
            color: #fff;
            margin-top: 30px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .md-container h1 { font-size: 2.2rem; border-bottom: 2px solid rgba(79, 172, 254, 0.3); padding-bottom: 10px; }
        .md-container h2 { font-size: 1.8rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        .md-container h3 { font-size: 1.4rem; color: #4facfe; }
        .md-container p { margin-bottom: 15px; }
        .md-container ul, .md-container ol { margin-left: 20px; margin-bottom: 15px; }
        .md-container li { margin-bottom: 5px; }
        .md-container strong { color: #fff; }
        .md-container blockquote {
            border-left: 4px solid #4facfe;
            padding-left: 15px;
            color: #aaa;
            background: rgba(79, 172, 254, 0.05);
            margin: 15px 0;
            padding: 10px 15px;
            border-radius: 0 5px 5px 0;
        }
        .md-container table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .md-container th, .md-container td { border: 1px solid rgba(255,255,255,0.1); padding: 10px; text-align: left; }
        .md-container th { background: rgba(255,255,255,0.05); color: #fff; }
        .md-container code { background: rgba(0,0,0,0.6); padding: 3px 6px; border-radius: 4px; color: #fb7299; font-family: monospace; }
        .md-container pre { background: #121212; padding: 15px; border-radius: 8px; overflow-x: auto; margin-bottom: 15px; border: 1px solid #333; }
        .md-container pre code { background: none; color: #ddd; padding: 0; }
        .md-container img { max-width: 100%; border-radius: 10px; margin: 15px 0; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div id="background" style="background: url('../../assets/bg_12.jpg') no-repeat center center; background-size: cover; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; filter: brightness(0.4);"></div>

    <div class="main-container">
        <a href="index.html" style="color: #4facfe; text-decoration: none; display: inline-block; margin-bottom: 20px; font-weight: bold; font-size: 1.1rem;"><i class="fa-solid fa-arrow-left"></i> 返回主推榜列表</a>
        
        <div id="contentWrapper" class="md-container">
            <h2 style="text-align:center; color:#4facfe;"><i class="fa-solid fa-spinner fa-spin"></i> 正在加载深度测评报告...</h2>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const brandId = urlParams.get('id');
            const wrapper = document.getElementById('contentWrapper');

            if (!brandId) {
                wrapper.innerHTML = '<h2 style="color:red; text-align:center;">参数错误：未找到指定的品牌 ID。</h2>';
                return;
            }

            // 动态加载 markdown 文件
            fetch(`./brands/${brandId}.md`)
                .then(response => {
                    if (!response.ok) throw new Error('网络响应错误，文件可能不存在。');
                    return response.text();
                })
                .then(markdown => {
                    // 简单的去除头部 FrontMatter (--- ... ---) 避免扰乱排版
                    let cleanMarkdown = markdown.replace(/^---[\s\S]+?---\n/, '');
                    
                    // 解析 Markdown 到 HTML
                    const htmlContent = marked.parse(cleanMarkdown);
                    wrapper.innerHTML = htmlContent;
                    document.title = brandId.toUpperCase() + " | 测评报告";
                })
                .catch(error => {
                    console.error('Fetching MD failed:', error);
                    wrapper.innerHTML = `<h2 style="color:red; text-align:center;">加载失败</h2><p style="text-align:center;">无法获取 ${brandId}.md 的内容。<br>可能该文件还未上传至服务器，请返回重试。</p>`;
                });
        });
    </script>
</body>
</html>
