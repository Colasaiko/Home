<body>
    <div id="background" style="background: url('../../assets/bg7.jpg') no-repeat center center; background-size: cover; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; filter: brightness(0.6);"></div>

    <div class="main-container">
        <a href="../index.html" style="color: #4facfe; text-decoration: none; display: inline-block; margin-bottom: 20px; font-weight: bold; font-size: 1.1rem;"><i class="fa-solid fa-arrow-left"></i> 返回专题库</a>
        
        <header class="profile-section" style="text-align: center; margin-bottom: 40px; background: rgba(0,0,0,0.5); padding: 40px 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);">
            <h1 class="welcome-title" style="font-size: 2.5rem; margin-bottom: 10px;">🌟 推荐<span>机场</span>品牌库</h1>
            <p style="color: #ccc; font-size: 1.1rem; max-width: 800px; margin: 0 auto; line-height: 1.6;">
                这里收录了我主推的几十家海外优质网络服务商（机场）的硬核测评报告。<br>
                <span style="color:#e34c26; font-size: 0.9rem;">(已自动净化：去除所有敏感引流链接与时效性优惠码，纯净技术评测)</span>
            </p>
        </header>

        <section class="section">
            <div class="hot-news-container" id="brandsContainer" style="grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));">
                <!-- 动态渲染品牌卡片 -->
                <p style="color: #fff; text-align: center;">加载中...</p>
            </div>
        </section>
    </div>

    <!-- 引入刚刚生成的品牌数据 -->
    <script src="./brands_data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('brandsContainer');
            if (typeof brandListData === 'undefined') {
                container.innerHTML = '<p style="color:red; text-align:center;">无法加载品牌数据。</p>';
                return;
            }

            let html = '';
            brandListData.forEach(brand => {
                // 如果没有正常提取到 title，就拿文件名做美化
                let displayTitle = brand.title;
                if(displayTitle === brand.id) {
                    displayTitle = brand.id.charAt(0).toUpperCase() + brand.id.slice(1) + " 测评报告";
                }

                html += `
                    <a href="brand.html?id=${brand.id}" class="hot-card" style="text-decoration:none; display:flex; flex-direction:column; justify-content:space-between; transition: 0.3s; cursor: pointer;">
                        <div>
                            <div class="hot-header" style="color: #4facfe; border-bottom: none; margin-bottom: 5px;">
                                <i class="fa-solid fa-paper-plane"></i>
                                <h3 style="font-size: 1.2rem; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${displayTitle}</h3>
                            </div>
                            <p style="color:#aaa; font-size:0.9rem; margin-top:10px;">点击查看此品牌的去引流版纯净测评与技术参数解析。</p>
                        </div>
                        <div style="margin-top:20px; display:flex; justify-content:flex-end;">
                            <span style="background: rgba(79, 172, 254, 0.2); color: #4facfe; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold;">查看详情 <i class="fa-solid fa-angle-right"></i></span>
                        </div>
                    </a>
                `;
            });

            container.innerHTML = html;
        });
    </script>
